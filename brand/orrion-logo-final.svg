<?xml version="1.0" encoding="UTF-8"?>
<!-- ORRION LOGO 定稿 — 字环·初光 (First Light Ring) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1160" viewBox="0 0 1520 1160"
     font-family="'Noto Sans CJK SC',Montserrat,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <style>
      .wm{fill:#10211C;font-weight:800;letter-spacing:7px;}
      .sub{fill:#8A9A95;font-size:15px;letter-spacing:1px;}
      .lbl{fill:#8A9A95;font-size:16px;letter-spacing:2px;font-weight:700;}
      .mean{fill:#0E7A5F;font-size:15px;font-weight:600;}
      .desc{fill:#5B6B66;font-size:13px;}
      .anno{fill:#10211C;font-size:14px;font-weight:600;}
    </style>

    <!-- ── MASTER MARK (200×200 canvas, ring r=80 sw=22, amber arc ~72°) ── -->
    <!--
      Ring: full circle r=80 cx=100 cy=100, stroke-width=22
      Emerald arc: ~288° (stroke-dasharray = 2π×80×288/360 ≈ 402.1, gap=full)
      Amber arc:   ~72°  (stroke-dasharray = 2π×80×72/360  ≈ 100.5, gap=full)
      Amber arc starts at -90°+216° = 126° from top (right-upper quadrant)
      rotate so amber sits top-right: rotate(-18 100 100) places gap start at top-right
    -->
    <g id="mark">
      <!-- emerald portion: 288° -->
      <circle cx="100" cy="100" r="80" fill="none" stroke="#0E7A5F" stroke-width="22"
              stroke-dasharray="402 503" stroke-linecap="butt"
              transform="rotate(-18 100 100)"/>
      <!-- amber portion: 72° — starts where emerald ends -->
      <circle cx="100" cy="100" r="80" fill="none" stroke="#E8A33D" stroke-width="22"
              stroke-dasharray="100.5 503" stroke-linecap="butt"
              transform="rotate(270 100 100)"/>
    </g>

    <!-- mono version (single color) -->
    <g id="markMono">
      <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="22"
              stroke-dasharray="402 503" stroke-linecap="butt"
              transform="rotate(-18 100 100)"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="22"
              stroke-dasharray="100.5 503" stroke-linecap="butt"
              transform="rotate(270 100 100)" opacity="0.45"/>
    </g>
  </defs>

  <rect width="1520" height="1160" fill="#FFFFFF"/>
  <text x="60" y="52" font-size="26" font-weight="800" fill="#10211C"
        font-family="'Noto Sans CJK SC',Montserrat,sans-serif">ORRION · 字环初光 FIRST LIGHT RING — 品牌标志定稿</text>
  <line x1="60" y1="72" x2="1460" y2="72" stroke="#E2E8E5"/>

  <!-- ═══════════════════════════════════════════════════════════════
       HERO + ANATOMY
  ═══════════════════════════════════════════════════════════════ -->
  <text class="lbl" x="60" y="112" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">标志 / SYMBOL</text>
  <use href="#mark" transform="translate(40,122) scale(1.1)"/>

  <!-- anatomy callouts -->
  <text class="lbl" x="500" y="112" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">含义 / MEANING</text>
  <g transform="translate(540,130)">
    <use href="#mark" transform="scale(1.05)"/>
    <!-- callout: amber arc = first light -->
    <line x1="178" y1="56" x2="250" y2="32" stroke="#C2C8CB"/>
    <text class="anno" x="256" y="28" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">琥珀弧 = 初光 / First Light</text>
    <text class="desc" x="256" y="48" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">最早进入镜圈的那一束信号</text>
    <!-- callout: emerald ring = optical system -->
    <line x1="20" y1="105" x2="-30" y2="105" stroke="#C2C8CB"/>
    <text class="anno" x="-200" y="100" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">绿环 = 光学系统边界</text>
    <text class="desc" x="-200" y="120" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">镜头口径 / 代谢成像采集圈</text>
    <!-- callout: O = brand O -->
    <line x1="100" y1="188" x2="100" y2="240" stroke="#C2C8CB"/>
    <text class="anno" x="50" y="260" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">字母 O = 品牌字母章</text>
    <text class="mean" x="0" y="295" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">初光进圈（琥珀）→ 光学采集（绿环）→ 量化输出</text>
  </g>

  <line x1="60" y1="480" x2="1460" y2="480" stroke="#EDEFEE"/>

  <!-- ═══════════════════════════════════════════════════════════════
       LOCKUPS
  ═══════════════════════════════════════════════════════════════ -->
  <text class="lbl" x="60" y="520" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">横排 / HORIZONTAL</text>
  <use href="#mark" transform="translate(60,530) scale(0.62)"/>
  <g transform="translate(200,560)">
    <text class="wm" x="0" y="32" font-size="58" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif">ORRION</text>
    <text class="sub" x="4" y="62" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">Optical Metabolic Imaging · 光学代谢成像</text>
  </g>

  <text class="lbl" x="720" y="520" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">竖排 / STACKED</text>
  <use href="#mark" transform="translate(750,530) scale(0.7)"/>
  <text class="wm" x="822" y="700" font-size="42" text-anchor="middle"
        font-family="Montserrat,'Helvetica Neue',Arial,sans-serif">ORRION</text>
  <text x="822" y="734" font-size="20" fill="#0E7A5F" font-weight="600" letter-spacing="14"
        text-anchor="middle" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">欧 锐 安</text>

  <text class="lbl" x="1020" y="520" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">字母章 / MONOGRAM</text>
  <use href="#mark" transform="translate(1060,530) scale(0.9)"/>

  <line x1="60" y1="780" x2="1460" y2="780" stroke="#EDEFEE"/>

  <!-- ═══════════════════════════════════════════════════════════════
       APPLICATIONS
  ═══════════════════════════════════════════════════════════════ -->
  <text class="lbl" x="60" y="818" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">单色 / MONO</text>
  <use href="#markMono" transform="translate(60,828) scale(0.55)" color="#10211C"/>

  <text class="lbl" x="240" y="818" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">反白 / 深色底</text>
  <rect x="240" y="828" width="150" height="150" rx="16" fill="#10211C"/>
  <use href="#markMono" transform="translate(262,848) scale(0.5)" color="#FFFFFF"/>

  <text class="lbl" x="440" y="818" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">小尺寸 24 / 32 / 48</text>
  <!-- 24px -->
  <g transform="translate(446,870)">
    <circle cx="12" cy="12" r="9.6" fill="none" stroke="#0E7A5F" stroke-width="2.7"
            stroke-dasharray="48.3 60.3" stroke-linecap="butt" transform="rotate(-18 12 12)"/>
    <circle cx="12" cy="12" r="9.6" fill="none" stroke="#E8A33D" stroke-width="2.7"
            stroke-dasharray="12.1 60.3" stroke-linecap="butt" transform="rotate(270 12 12)"/>
  </g>
  <!-- 32px -->
  <g transform="translate(490,858)">
    <circle cx="16" cy="16" r="12.8" fill="none" stroke="#0E7A5F" stroke-width="3.6"
            stroke-dasharray="64.3 80.4" stroke-linecap="butt" transform="rotate(-18 16 16)"/>
    <circle cx="16" cy="16" r="12.8" fill="none" stroke="#E8A33D" stroke-width="3.6"
            stroke-dasharray="16.1 80.4" stroke-linecap="butt" transform="rotate(270 16 16)"/>
  </g>
  <!-- 48px -->
  <g transform="translate(546,840)">
    <circle cx="24" cy="24" r="19.2" fill="none" stroke="#0E7A5F" stroke-width="5.3"
            stroke-dasharray="96.5 120.6" stroke-linecap="butt" transform="rotate(-18 24 24)"/>
    <circle cx="24" cy="24" r="19.2" fill="none" stroke="#E8A33D" stroke-width="5.3"
            stroke-dasharray="24.1 120.6" stroke-linecap="butt" transform="rotate(270 24 24)"/>
  </g>

  <text class="lbl" x="660" y="818" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">APP 图标 / FAVICON</text>
  <rect x="660" y="828" width="120" height="120" rx="26" fill="#0E7A5F"/>
  <!-- white ring on green bg, amber arc -->
  <g transform="translate(660,828)">
    <circle cx="60" cy="60" r="38" fill="none" stroke="#FFFFFF" stroke-width="10.5"
            stroke-dasharray="191.7 239.8" stroke-linecap="butt" transform="rotate(-18 60 60)"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="#E8A33D" stroke-width="10.5"
            stroke-dasharray="47.9 239.8" stroke-linecap="butt" transform="rotate(270 60 60)"/>
  </g>

  <text class="lbl" x="840" y="818" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">设备蚀刻 / 金色版</text>
  <rect x="840" y="828" width="200" height="130" rx="12" fill="#1A1A1A"/>
  <g transform="translate(870,858)">
    <circle cx="35" cy="35" r="28" fill="none" stroke="#C9A84C" stroke-width="8"
            stroke-dasharray="141.4 176.7" stroke-linecap="butt" transform="rotate(-18 35 35)"/>
    <circle cx="35" cy="35" r="28" fill="none" stroke="#C9A84C" stroke-width="8"
            stroke-dasharray="35.3 176.7" stroke-linecap="butt" transform="rotate(270 35 35)" opacity="0.5"/>
    <text x="80" y="46" fill="#C9A84C" font-size="22" font-weight="800" letter-spacing="3"
          font-family="Montserrat,'Helvetica Neue',Arial,sans-serif">ORRION</text>
  </g>

  <line x1="60" y1="1010" x2="1460" y2="1010" stroke="#EDEFEE"/>

  <!-- COLOR PALETTE -->
  <text class="lbl" x="60" y="1048" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">品牌色 / BRAND COLORS</text>
  <rect x="60" y="1060" width="100" height="40" rx="6" fill="#0E7A5F"/>
  <text x="60" y="1118" class="desc" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">深翠 #0E7A5F</text>
  <rect x="180" y="1060" width="100" height="40" rx="6" fill="#E8A33D"/>
  <text x="180" y="1118" class="desc" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">琥珀 #E8A33D</text>
  <rect x="300" y="1060" width="100" height="40" rx="6" fill="#10211C"/>
  <text x="300" y="1118" class="desc" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">墨绿 #10211C</text>
  <rect x="420" y="1060" width="100" height="40" rx="6" fill="#F4F6F5" stroke="#E2E8E5"/>
  <text x="420" y="1118" class="desc" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">云白 #F4F6F5</text>
  <rect x="540" y="1060" width="100" height="40" rx="6" fill="#C9A84C"/>
  <text x="540" y="1118" class="desc" font-family="'Noto Sans CJK SC',Montserrat,sans-serif">金蚀刻 #C9A84C</text>
</svg>
