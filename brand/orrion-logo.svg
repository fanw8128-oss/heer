<?xml version="1.0" encoding="UTF-8"?>
<!-- ORRION Brand Master Sheet — vector. Aperture(光圈)+焦点(信号) 标志 / 平台级定位 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Montserrat,'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Brand palette -->
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15A37B"/>
      <stop offset="1" stop-color="#0C6B50"/>
    </linearGradient>
    <style>
      .ink{fill:#10211C;}
      .sub{fill:#5B6B66;}
      .em{stroke:#0E7A5F;}
      .am{stroke:#E8A33D;}
      .wm{fill:#10211C; font-weight:800; letter-spacing:14px;}
      .cn{fill:#10211C; font-weight:500; letter-spacing:26px;}
      .lbl{fill:#8A9A95; font-size:18px; letter-spacing:2px; font-weight:600;}
    </style>

    <!-- === SYMBOL (reusable) ===
         Aperture = 6 blades(光圈叶片), 1 amber blade = "捕获的那束信号";
         center focal dot = 焦点. Thin barrel ring = 镜筒. -->
    <g id="mark">
      <circle cx="100" cy="100" r="92" fill="none" stroke="#0E7A5F" stroke-width="6"/>
      <!-- emerald blades -->
      <g fill="none" stroke="#0E7A5F" stroke-width="11" stroke-linecap="round">
        <line x1="139" y1="167.5" x2="100" y2="134"/>
        <line x1="61"  y1="167.5" x2="70.6" y2="117"/>
        <line x1="22"  y1="100"   x2="70.6" y2="83"/>
        <line x1="61"  y1="32.5"  x2="100" y2="66"/>
        <line x1="139" y1="32.5"  x2="129.4" y2="83"/>
      </g>
      <!-- amber signal blade -->
      <line x1="178" y1="100" x2="129.4" y2="117" fill="none" stroke="#E8A33D" stroke-width="11" stroke-linecap="round"/>
      <!-- focal point + micro crosshair -->
      <circle cx="100" cy="100" r="9" fill="#E8A33D"/>
      <g stroke="#0E7A5F" stroke-width="4" stroke-linecap="round">
        <line x1="100" y1="78" x2="100" y2="88"/>
        <line x1="100" y1="112" x2="100" y2="122"/>
        <line x1="78" y1="100" x2="88" y2="100"/>
        <line x1="112" y1="100" x2="122" y2="100"/>
      </g>
    </g>

    <g id="markMono">
      <circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="6"/>
      <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round">
        <line x1="139" y1="167.5" x2="100" y2="134"/>
        <line x1="61"  y1="167.5" x2="70.6" y2="117"/>
        <line x1="22"  y1="100"   x2="70.6" y2="83"/>
        <line x1="61"  y1="32.5"  x2="100" y2="66"/>
        <line x1="139" y1="32.5"  x2="129.4" y2="83"/>
        <line x1="178" y1="100" x2="129.4" y2="117"/>
      </g>
      <circle cx="100" cy="100" r="9" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1600" height="1100" fill="#FFFFFF"/>

  <!-- 1. Primary horizontal lockup -->
  <text class="lbl" x="80" y="70">PRIMARY LOCKUP / 主标</text>
  <use href="#mark" x="80" y="100" width="200" height="200" transform="translate(80,100)"/>
  <g transform="translate(330,150)">
    <text class="wm" x="0" y="80" font-size="96">ORRION</text>
    <line x1="4" y1="120" x2="690" y2="120" stroke="#D8E0DD" stroke-width="2"/>
    <text class="sub" x="6" y="160" font-size="24" letter-spacing="3" font-weight="500">Optical Metabolic Imaging · 光学代谢成像系统</text>
  </g>

  <!-- 2. Stacked lockup -->
  <text class="lbl" x="80" y="430">STACKED / 竖排</text>
  <use href="#mark" transform="translate(150,460) scale(0.9)"/>
  <text class="wm" x="240" y="710" font-size="54" text-anchor="middle">ORRION</text>
  <text class="cn" x="253" y="752" font-size="24" text-anchor="middle">欧 锐 安</text>

  <!-- 3. Symbol only -->
  <text class="lbl" x="560" y="430">SYMBOL / 标志</text>
  <use href="#mark" transform="translate(560,460)"/>

  <!-- 4. Monochrome (knockout / 反白) -->
  <text class="lbl" x="880" y="430">MONO / 单色</text>
  <rect x="880" y="460" width="200" height="200" rx="20" fill="#10211C"/>
  <use href="#markMono" transform="translate(880,460) scale(1)" color="#FFFFFF"/>
  <use href="#markMono" transform="translate(1120,460)" color="#10211C"/>

  <!-- 5. Device etched (设备蚀刻/丝印) — single line, low-relief look -->
  <text class="lbl" x="80" y="830">ON-DEVICE / 设备蚀刻 (单色阳极氧化)</text>
  <rect x="80" y="855" width="640" height="170" rx="16" fill="#E9ECEB"/>
  <use href="#markMono" transform="translate(110,872) scale(0.65)" color="#7C8A85"/>
  <text x="270" y="965" font-size="52" font-weight="800" letter-spacing="10" fill="#7C8A85">ORRION</text>

  <!-- 6. Palette -->
  <text class="lbl" x="800" y="830">PALETTE / 色板</text>
  <g transform="translate(800,855)" font-size="16" font-weight="600">
    <rect width="150" height="80" rx="8" fill="#0E7A5F"/><text x="10" y="110" fill="#10211C">Deep Emerald</text><text x="10" y="132" fill="#8A9A95">#0E7A5F</text>
    <rect x="170" width="150" height="80" rx="8" fill="#15A37B"/><text x="180" y="110" fill="#10211C">Signal Green</text><text x="180" y="132" fill="#8A9A95">#15A37B</text>
    <rect x="340" width="150" height="80" rx="8" fill="#E8A33D"/><text x="350" y="110" fill="#10211C">Amber Signal</text><text x="350" y="132" fill="#8A9A95">#E8A33D</text>
    <rect x="510" width="150" height="80" rx="8" fill="#10211C"/><text x="520" y="110" fill="#10211C">Ink</text><text x="520" y="132" fill="#8A9A95">#10211C</text>
    <rect x="680" width="150" height="80" rx="8" fill="#F4F6F5" stroke="#D8E0DD"/><text x="690" y="110" fill="#10211C">Cloud</text><text x="690" y="132" fill="#8A9A95">#F4F6F5</text>
  </g>
</svg>
